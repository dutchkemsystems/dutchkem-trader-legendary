# docker-compose.prod.yml
version: "3.9"

services:
  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports: []  # No exposed ports in prod

  redis:
    command: >
      redis-server --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports: []

  backend:
    user: "1000:1000"
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  fastapi:
    user: "1000:1000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    user: "1000:1000"
    command: celery -A config.celery_app worker --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-beat:
    user: "1000:1000"
    command: celery -A config.celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    user: "nextjs:nodejs"
    ports: []
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: dutchkem-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - dutchkem-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Database Backup ---
  db-backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dutchkem-backup
    env_file: .env
    volumes:
      - db-backups:/backups
    command: >
      sh -c "while true; do
        pg_dump -h db -U $POSTGRES_USER $POSTGRES_DB | gzip > /backups/backup_$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz;
        find /backups -name '*.sql.gz' -mtime +30 -delete;
        sleep 86400;
      done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dutchkem-net

  # --- Monitoring Stack ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dutchkem-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - dutchkem-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: dutchkem-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-change_me}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dutchkem-net

  loki:
    image: grafana/loki:3.1.0
    container_name: dutchkem-loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - dutchkem-net

  promtail:
    image: grafana/promtail:3.1.0
    container_name: dutchkem-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - dutchkem-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: dutchkem-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - dutchkem-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: dutchkem-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/dutchkem_trader?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - dutchkem-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dutchkem-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - dutchkem-net

volumes:
  nginx-ssl:
  db-backups:
  prometheus_data:
  grafana_data:
  loki_data:
