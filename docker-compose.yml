# docker-compose.yml
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dutchkem-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dutchkem-net

  redis:
    image: redis:7-alpine
    container_name: dutchkem-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dutchkem-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dutchkem-backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - dutchkem-net

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dutchkem-fastapi
    env_file: .env
    ports:
      - "8001:8001"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - dutchkem-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dutchkem-celery
    env_file: .env
    command: celery -A config.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery_app inspect ping --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    networks:
      - dutchkem-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dutchkem-beat
    env_file: .env
    command: celery -A config.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dutchkem-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dutchkem-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - dutchkem-net

  nginx:
    image: nginx:alpine
    container_name: dutchkem-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - dutchkem-net

volumes:
  postgres_data:
  redis_data:
  db-backups:

networks:
  dutchkem-net:
    driver: bridge
