# nginx/dev.conf — HTTP-only for local development
upstream fastapi_api {
    server fastapi:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # API routes → FastAPI (unified)
    location /api/ {
        proxy_pass http://fastapi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket routes → FastAPI
    location /ws/ {
        proxy_pass http://fastapi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://fastapi_api/api/v1/health;
        proxy_set_header Host $host;
    }

    # Metrics
    location /metrics {
        proxy_pass http://fastapi_api/metrics;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
